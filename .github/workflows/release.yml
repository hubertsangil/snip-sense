name: Build and Release Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build Windows Executable
        run: |
          pyinstaller snipsense.spec

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF -match 'refs/tags/v?(.*)') { $Matches[1] } else { "1.0.0" }
          $ZipName = "SnipSense-v$Version-windows-x64.zip"
          Compress-Archive -Path "dist/SnipSense/*" -DestinationPath "dist/$ZipName" -Force
          Write-Host "Created archive: dist/$ZipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SnipSense v${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/SnipSense-*.zip
